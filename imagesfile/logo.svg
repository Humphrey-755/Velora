<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Vibrant Blue to Dark Purple Gradient -->
    <linearGradient id="roadmapGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(15, 20)" filter="url(#glow)">
    <!-- Seamless Curved Roadmap Path -->
    <path 
      d="M 30 150 C 70 150, 80 30, 150 30 C 220 30, 210 170, 280 170 C 310 170, 325 130, 340 90" 
      fill="none" 
      stroke="url(#roadmapGradient)" 
      stroke-width="16" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Milestone Nodes -->
    <circle cx="30" cy="150" r="9" fill="#0b0a1a" stroke="#2563eb" stroke-width="5" />
    <circle cx="150" cy="30" r="9" fill="#0b0a1a" stroke="#6366f1" stroke-width="5" />
    <circle cx="280" cy="170" r="9" fill="#0b0a1a" stroke="#a855f7" stroke-width="5" />

    <!-- Completion Badge (Checkmark Node) -->
    <g transform="translate(340, 80)">
      <circle cx="0" cy="0" r="26" fill="#a855f7" />
      <path 
        d="M -9 0 L -2 7 L 10 -5" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
      />
    </g>
  </g>
</svg>
