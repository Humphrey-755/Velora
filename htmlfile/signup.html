<!DOCTYPE html>
<html>
    <head>
        <title>Sign up-Velora</title>
        <link rel="icon" type="image/x-icon" href="../imagesfile/logo.svg">
        <link rel="stylesheet" href="../cssfile/signup.css">
        <script src="../javascriptfile/signup.js" defer></script>
    </head>
    <body>
        <div class="signup-container">
             <p class="well">
            Get started with us
        </p>
        <form action="loginpage.html" class="signup-form" method="post">
            <input type="email" name="username" class="mail-control" placeholder="Email" required>
            <input type="password" name="password" class="pass-control" placeholder="Password" required>
            <p class="confirmity">Confirm password</p>
            <input type="password" name="password" class="pass-control" placeholder="Confirm Password" required>
            <button class="finish-button" type="submit">Finish</button>
        </form>
        <p class="have-account">
            Have an account? <a class="have-account-link" href="loginpage.html">Login</a>
        </p>
        </div>
    </body>
</html>
